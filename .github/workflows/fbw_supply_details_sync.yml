name: Sync FBW Supply Details (WB → Supabase)

on:
  schedule:
    - cron: "5 4 * * *"   # 07:05 MSK == 04:05 UTC, чуть позже основного списка
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run details sync
        env:
          WB_SUPPLIES_TOKEN:    ${{ secrets.WB_SUPPLIES_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SCHEMA: "public"
          SUPABASE_SUPPLIES_TABLE: "fbw_supplies"
          SUPABASE_DETAILS_TABLE:  "fbw_supply_details"
          # Дефолтная пауза между запросами (лимит WB — 30/мин)
          REQUEST_SLEEP_SEC: "2.1"
        run: |
          python fetch_wb_fbw_supply_details.py
