name: FBW Supply Details — Daily (last 7 days)

on:
  schedule:
    - cron: "5 4 * * *"   # 07:05 MSK == 04:05 UTC
  workflow_dispatch: {}

concurrency:
  group: fbw-supply-details
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run details sync (7 days, UPSERT)
        env:
          PYTHONUNBUFFERED: "1"
          WB_SUPPLIES_TOKEN:    ${{ secrets.WB_SUPPLIES_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SCHEMA: "public"
          SUPABASE_SUPPLIES_TABLE: "fbw_supplies"
          SUPABASE_DETAILS_TABLE:  "fbw_supply_details"
          REQUEST_SLEEP_SEC: "2.1"
          DETAILS_UPDATED_DAYS: "7"
          MAX_KEYS: ""
          LOG_EVERY: "25"
          FULL_REFRESH: "false"         # ← инкрементальный UPSERT, ничего не удаляем
        run: |
          python -u fetch_wb_fbw_supply_details.py
